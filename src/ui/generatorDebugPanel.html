<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成调试</title>
    <!-- 复用 module-editor 的主题变量（零变量重复） -->
    <link rel="stylesheet" href="../shared/styles/themes.css">
    <!-- 调试弹窗专用样式（全部使用 CSS 变量） -->
    <link rel="stylesheet" href="generatorDebugPanel.css">
</head>

<body>
    <header class="ccore-debug-header">
        <h3 class="ccore-debug-title">生成调试</h3>
        <div class="ccore-debug-history-nav" style="display:none;">
            <button class="ccore-debug-history-prev" title="上一条">‹</button>
            <span class="ccore-debug-history-counter">0/0</span>
            <button class="ccore-debug-history-next" title="下一条">›</button>
        </div>
        <button class="ccore-debug-close" title="关闭">&#x2715;</button>
    </header>
    <div class="ccore-debug-body">
        <!-- sections 由父窗口 onLoad 注入 -->
    </div>
</body>

</html>
