<div class="continuity-core-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>
                <span class="ccore-badge">CCore</span>
                <span style="margin-left: 5px; font-size: 0.95em;" data-i18n="ccore_settings_module_center">模块中心</span>
            </b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <div class="continuity-settings-container">
                <div class="continuity-header-row">
                    <div class="continuity-toggle-row">
                        <label class="continuity-toggle-switch">
                            <input id="continuity_enabled" type="checkbox" />
                            <span class="continuity-toggle-slider"></span>
                        </label>
                        <label for="continuity_enabled" data-i18n="ccore_settings_enabled">启用插件</label>
                    </div>
                    <div class="continuity-version-info">
                        Continuity Core v1.0.0
                    </div>
                </div>
                
                <div class="continuity-tabs">
                    <button class="continuity-tab-btn active" data-tab="interface" data-i18n="ccore_settings_tab_interface">界面设置</button>
                    <button class="continuity-tab-btn" data-tab="async" data-i18n="ccore_settings_tab_async">异步存储</button>
                    <button class="continuity-tab-btn" data-tab="backend" data-i18n="ccore_settings_tab_backend">后端配置</button>
                    <button class="continuity-tab-btn" data-tab="debug" data-i18n="ccore_settings_tab_debug">调试设置</button>
                </div>
                
                <div class="continuity-tab-content active" id="tab-interface">
                    <div class="continuity-form-row">
                        <label for="continuity_button_type" class="continuity-form-label" data-i18n="ccore_settings_button_type">按钮类型:</label>
                        <select id="continuity_button_type" class="continuity-form-input">
                            <option value="embedded" data-i18n="ccore_settings_button_embedded">嵌入按钮</option>
                            <option value="floating" data-i18n="ccore_settings_button_floating">浮动按钮</option>
                        </select>
                    </div>
                </div>
                
                <div class="continuity-tab-content" id="tab-async">
                    <div class="example-extension_block flex-container">
                        <input id="continuity_async_enabled" type="checkbox" />
                        <label for="continuity_async_enabled" data-i18n="ccore_settings_async_enabled">异步模块存储</label>
                    </div>
                    <small data-i18n="ccore_settings_async_enabled_hint">需安装服务器插件。开启后非正文模块异步生成并分开存储。</small>
                    <div class="continuity-form-row" style="margin-top: 8px;">
                        <label for="continuity_snapshot_interval" class="continuity-form-label" data-i18n="ccore_settings_snapshot_interval">快照间隔:</label>
                        <input id="continuity_snapshot_interval" type="number" min="1" max="100" class="continuity-form-input" />
                    </div>
                    <small data-i18n="ccore_settings_snapshot_interval_hint">每隔多少层生成一次累积状态快照，默认5。</small>
                </div>
                
                <div class="continuity-tab-content" id="tab-backend">
                    <div class="continuity-form-row">
                        <label for="continuity_backend_url" class="continuity-form-label" data-i18n="ccore_settings_backend_url">服务器地址:</label>
                        <input id="continuity_backend_url" type="text" class="continuity-form-input"
                            placeholder="http://localhost:8888" data-i18n="ccore_settings_backend_url" />
                    </div>
                    <div class="example-extension_block">
                        <button id="continuity_test_backend" type="button" class="menu_button"
                            style="width:auto;" data-i18n="ccore_settings_test_backend">测试后端连接</button>
                    </div>
                </div>
                
                <div class="continuity-tab-content" id="tab-debug">
                    <div class="example-extension_block flex-container">
                        <input id="continuity_debug_logs" type="checkbox" />
                        <label for="continuity_debug_logs" data-i18n="ccore_settings_debug_logs">显示调试日志</label>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
