<!-- src/features/nai-preset-switcher/index.html -->
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智绘姬NAI预设切换</title>
    <link rel="stylesheet" href="../../shared/styles/themes.css">
    <link rel="stylesheet" href="../../shared/styles/editor-shell.css">
    <link rel="stylesheet" href="styles/layout.css">
</head>

<body>
    <header class="app-header">
        <div class="header-title" data-i18n="ccore_nai_preset_title">智绘姬NAI预设切换</div>
        <div class="header-actions">
            <!-- 顶栏按钮按当前 tab 切换显隐：data-nav 标记所属页面 -->
            <button id="np-import-tags" class="btn-secondary" data-nav="preset" style="padding:6px 12px; font-size:13px;">导入标签</button>
            <button id="np-export-tags" class="btn-secondary" data-nav="preset" style="padding:6px 12px; font-size:13px;">导出标签</button>
            <button id="np-inspect-copy" class="btn-secondary" data-nav="parse" style="padding:6px 12px; font-size:13px;" disabled>复制全部</button>
            <button id="np-add-from-inspect" class="btn-primary" data-nav="parse" style="padding:6px 12px; font-size:13px;" disabled>添加为预设</button>
            <button id="np-chat-scan" class="btn-secondary" data-nav="vibe" style="padding:6px 12px; font-size:13px;" title="扫描当前聊天，确定提示词与聊天/角色的对应关系">扫描聊天</button>
            <button id="np-img-manage" class="btn-secondary" data-nav="vibe" style="padding:6px 12px; font-size:13px;">管理模式</button>
            <button id="close-btn"
                style="background:none; border:none; color:var(--text-primary); font-size:20px; cursor:pointer;">✕</button>
        </div>
    </header>

    <div class="app-container">
        <!-- 左侧主导航栏 -->
        <nav class="main-nav">
            <div class="nav-item active" data-target="view-preset">
                <span class="nav-text" data-i18n="ccore_nai_tab_preset">预设管理</span>
            </div>
            <div class="nav-item" data-target="view-vibe">
                <span class="nav-text" data-i18n="ccore_nai_tab_images">图片管理</span>
            </div>
            <div class="nav-item" data-target="view-fav">
                <span class="nav-text" data-i18n="ccore_nai_tab_image_fav">图片收藏</span>
            </div>
            <div class="nav-item" data-target="view-parse">
                <span class="nav-text" data-i18n="ccore_nai_tab_parse">解析</span>
            </div>
            <div class="nav-item" data-target="view-tools">
                <span class="nav-text" data-i18n="ccore_nai_tab_tools">工具箱</span>
            </div>
        </nav>

        <!-- 内容区域 -->
        <main class="content-area">
            <!-- 视图：预设 -->
            <div id="view-preset" class="view-section active">
                <div class="np-toolbar">
                    <input type="text" id="np-search" class="np-search" placeholder="搜索名称或标签…" />
                    <button id="np-sort" class="btn-sort" title="排序方式"></button>
                    <button id="np-random" class="btn-secondary" style="padding:6px 12px; font-size:13px;" title="在当前筛选范围内随机应用一个预设">🎲 随机</button>
                    <button id="np-manage-tags" class="btn-primary" style="padding:6px 12px; font-size:13px;">管理标签</button>
                </div>

                <div class="np-tag-bar" id="np-tag-bar">
                    <!-- 标签筛选由 JS 生成 -->
                </div>

                <div class="np-list" id="np-list">
                    <!-- 预设卡片由 JS 生成 -->
                </div>

                <button id="np-scroll-top" class="np-scroll-top" title="回到顶部" style="display:none;">↑</button>
            </div>

            <!-- 视图：图片管理（三路并列：文内生图 / 角色预设 / 服装预设） -->
            <div id="view-vibe" class="view-section">
                <div class="np-img-toolbar">
                    <div class="np-img-cats" id="np-img-cats">
                        <button class="np-img-cat active" data-cat="chat">文生图</button>
                        <button class="np-img-cat" data-cat="character">角色图</button>
                        <button class="np-img-cat" data-cat="outfit">服装图</button>
                    </div>
                    <div class="np-img-sub" id="np-img-sub">
                        <!-- 文内生图：按提示词/按预设/按角色可叠加 toggle（空=全部按排序铺开） -->
                        <div class="np-img-sub-group np-img-sub-toggle" data-for="chat">
                            <button class="np-img-sub-btn" data-group="character" title="按 角色→聊天→楼层 分组（需先扫描聊天）">+按角色</button>
                            <button class="np-img-sub-btn" data-group="prompt">+按提示词</button>
                            <button class="np-img-sub-btn" data-group="preset">+按预设</button>
                            <button class="np-img-sub-btn np-img-sub-btn-extra" id="np-img-only-current" title="只看每个提示词当前选中的那张图（需开启按提示词）">只看当前选中</button>
                        </div>
                        <!-- 角色/服装：按提示词/按预设可叠加的独立开关（默认不选） -->
                        <div class="np-img-sub-group np-img-sub-toggle" data-for="presetcat">
                            <button class="np-img-sub-btn" data-group="prompt">+按提示词</button>
                            <button class="np-img-sub-btn" data-group="preset">+按预设</button>
                        </div>
                    </div>
                    <button id="np-img-sort" class="btn-sort" title="排序方式"></button>
                    <input type="text" id="np-img-search" class="np-img-search" placeholder="搜索分组名 / 提示词…" />
                </div>
                <!-- 批量操作栏（管理模式显示） -->
                <div class="np-img-batchbar" id="np-img-batchbar" style="display:none;">
                    <span id="np-img-sel-count">已选 0 张</span>
                    <div class="np-img-batch-actions">
                        <button class="btn-secondary" id="np-img-sel-clear">清空</button>
                        <button class="btn-secondary" id="np-img-sel-fav" disabled>收藏已选</button>
                        <button class="btn-danger" id="np-img-sel-delete" disabled>删除已选</button>
                    </div>
                </div>
                <!-- 顶部页码导航（分组分页） -->
                <div class="np-img-pager" id="np-img-pager-top"></div>
                <div class="np-img-list" id="np-img-list">
                    <!-- 分组与图片网格由 JS 生成 -->
                </div>
                <div class="np-img-empty" id="np-img-empty" style="display:none;">该分类暂无图片</div>
            </div>

            <!-- 视图：图片收藏（红心图片聚合，独立标签筛选） -->
            <div id="view-fav" class="view-section">
                <div class="np-fav-toolbar">
                    <span class="np-fav-title">图片收藏</span>
                    <div class="np-fav-tags" id="np-fav-tags">
                        <!-- 标签筛选由 JS 生成 -->
                    </div>
                    <button class="btn-secondary" id="np-fav-manage-tags" style="padding:6px 12px; font-size:13px;">管理标签</button>
                    <button class="btn-secondary" id="np-fav-empty" style="padding:6px 12px; font-size:13px;" title="清空全部收藏">清空收藏</button>
                </div>
                <div class="np-fav-list" id="np-fav-list">
                    <!-- 收藏图片网格由 JS 生成 -->
                </div>
                <div class="np-fav-empty-tip" id="np-fav-empty-tip" style="display:none;">暂无收藏图片</div>
            </div>

            <!-- 视图：解析 -->
            <div id="view-parse" class="view-section">
                <div class="np-inspect-wrap">
                    <div class="np-inspect-header">
                        <div class="np-inspect-title form-section-title">图片参数解析</div>
                        <div class="np-inspect-hint">拖拽图片到下方区域，或点击选择图片，解析其内嵌的生成参数（支持 NovelAI / SD WebUI / 隐写通道）。</div>
                    </div>

                    <div class="np-inspect-drop" id="np-inspect-drop">
                        <img class="np-inspect-drop-img" id="np-inspect-drop-img" alt="预览" />
                        <div class="np-inspect-drop-icon">🖼️</div>
                        <div class="np-inspect-drop-text">点击或拖拽图片到此处</div>
                        <div class="np-inspect-drop-sub">支持 PNG / JPEG / WEBP（再次拖拽可重新解析）</div>
                    </div>
                    <input type="file" id="np-inspect-file" accept="image/*" style="display:none;" />

                    <div class="np-inspect-result" id="np-inspect-result"></div>
                </div>
            </div>

            <!-- 视图：工具箱 -->
            <div id="view-tools" class="view-section">
                <div class="detail-content">
                    <div class="toolbox-container">
                        <div class="form-section-title" data-i18n="ccore_nai_tools_title">数据工具</div>
                        <div class="toolbox-actions">
                            <button id="np-import-legacy" class="btn-secondary" data-i18n="ccore_nai_import_legacy">导入旧配置</button>
                            <button id="np-sync-images" class="btn-secondary" data-i18n="ccore_nai_sync_images">同步旧配置图片到智绘姬</button>
                            <button id="np-print-config" class="btn-secondary" data-i18n="ccore_nai_print_config">打印配置</button>
                            <button id="np-print-chatu8" class="btn-secondary">打印智绘姬预设</button>
                            <button id="np-backdate-defaults" class="btn-secondary">回填默认预设日期</button>
                        </div>
                        <div id="np-tools-result" class="np-tools-result"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 图片放大预览层（lightbox） -->
    <div class="np-lightbox" id="np-lightbox" style="display:none;">
        <img class="np-lightbox-img" id="np-lightbox-img" alt="预览" />
        <div class="np-lightbox-info" id="np-lightbox-info"></div>
        <div class="np-lightbox-actions">
            <button class="np-lightbox-download" id="np-lightbox-download" title="下载原图">⤓ 下载原图</button>
            <button class="np-lightbox-fav" id="np-lightbox-fav" title="收藏">♡</button>
            <button class="np-lightbox-setcurrent" id="np-lightbox-setcurrent" title="设为当前选中（智绘姬将显示此图）">✓ 设为当前</button>
            <button class="btn-danger np-lightbox-delete" id="np-lightbox-delete" title="删除这张图片">🗑 删除</button>
            <button class="np-lightbox-close" id="np-lightbox-close">✕ 关闭</button>
        </div>
        <button class="np-lightbox-nav np-lightbox-prev" id="np-lightbox-prev" title="上一张">‹</button>
        <button class="np-lightbox-nav np-lightbox-next" id="np-lightbox-next" title="下一张">›</button>
    </div>

    <!-- 编辑弹层（通用 shell 弹层 .modal-mask / .modal） -->
    <div class="modal-mask" id="np-modal-mask" style="display:none;">
        <div class="modal">
            <div class="np-modal-title" id="np-modal-title">新建预设</div>
            <div class="np-form-row">
                <label>名称</label>
                <input type="text" id="np-f-name" class="np-input" placeholder="预设名称" />
            </div>
            <div class="np-editor-split">
                <div class="np-form-row">
                    <label>预览图</label>
                    <div id="np-f-dropzone" class="np-dropzone">
                        <img id="np-f-preview-img" class="np-dropzone-img" alt="" style="display:none;" />
                        <div id="np-f-dropzone-hint" class="np-dropzone-hint">拖拽图片到此处，或点击选择</div>
                        <div id="np-f-dropzone-actions" class="np-dropzone-actions" style="display:none;">
                            <button id="np-f-img-change" class="btn-secondary np-dropzone-btn">更换</button>
                            <button id="np-f-img-remove" class="btn-secondary np-dropzone-btn">移除</button>
                        </div>
                    </div>
                    <input type="file" id="np-f-img-input" accept="image/*" style="display:none;" />
                </div>
                <div class="np-form-row">
                    <label>标签</label>
                    <div id="np-f-tags" class="np-tag-editor"></div>
                    <div class="np-tag-pool-wrap">
                        <div class="np-tag-pool-bar">
                            <input type="text" id="np-f-tag-search" class="np-input np-tag-search" placeholder="搜索标签…" />
                            <button id="np-f-tag-all" class="btn-secondary np-tag-pool-btn">全选</button>
                            <button id="np-f-tag-clear" class="btn-secondary np-tag-pool-btn">清空</button>
                            <span id="np-f-tag-count" class="np-tag-pool-count"></span>
                        </div>
                        <div id="np-f-tag-pool" class="np-tag-pool"></div>
                    </div>
                    <div class="np-tag-add">
                        <input type="text" id="np-f-tag-input" class="np-input" placeholder="新建标签名" />
                        <button id="np-f-tag-add" class="btn-secondary">新建并选中</button>
                    </div>
                </div>
            </div>
            <div class="np-form-row">
                <label>正向提示词</label>
                <textarea id="np-f-positive" class="np-input np-f-prompt" rows="4" placeholder="留空则不改写智绘姬当前值"></textarea>
            </div>
            <div class="np-form-row">
                <label>负向提示词</label>
                <textarea id="np-f-negative" class="np-input np-f-prompt" rows="3" placeholder="留空则不改写智绘姬当前值"></textarea>
            </div>
            <div class="np-modal-actions">
                <button id="np-cancel" class="btn-secondary">取消</button>
                <button id="np-save" class="btn-primary">保存</button>
            </div>
        </div>
    </div>

    <!-- 从解析结果添加预设弹层 -->
    <div class="modal-mask" id="np-add-mask" style="display:none;">
        <div class="modal">
            <div class="np-modal-title">从解析结果添加预设</div>
            <div class="np-form-row">
                <label>名称</label>
                <input type="text" id="np-add-name" class="np-input" placeholder="预设名称" />
            </div>
            <div class="np-form-row">
                <label>预览图（默认已放入解析的图片，可重新拖拽）</label>
                <div id="np-add-dropzone" class="np-dropzone">
                    <img id="np-add-preview-img" class="np-dropzone-img" alt="" style="display:none;" />
                    <div id="np-add-dropzone-hint" class="np-dropzone-hint">拖拽图片到此处，或点击选择</div>
                </div>
                <input type="file" id="np-add-img-input" accept="image/*" style="display:none;" />
            </div>
            <div class="np-form-row">
                <label>正向提示词</label>
                <textarea id="np-add-positive" class="np-input np-add-ta" rows="4"></textarea>
            </div>
            <div class="np-form-row">
                <label>负向提示词</label>
                <textarea id="np-add-negative" class="np-input np-add-ta" rows="3"></textarea>
            </div>
            <div class="np-modal-actions">
                <button id="np-add-cancel" class="btn-secondary">取消</button>
                <button id="np-add-save" class="btn-primary">添加到智绘姬</button>
            </div>
        </div>
    </div>

    <!-- 标签管理弹层（通用 shell 弹层） -->
    <div class="modal-mask" id="np-tag-mask" style="display:none;">
        <div class="modal">
            <div class="np-modal-title">标签管理</div>

            <div class="np-form-row">
                <label>新建标签（独立创建，无需关联预设）</label>
                <div class="np-tag-new">
                    <input type="text" id="np-tag-new-name" class="np-input" placeholder="新标签名" />
                    <button id="np-tag-new-add" class="btn-primary">添加</button>
                </div>
            </div>

            <div class="np-form-row">
                <label>现有标签（点击改名，删除会同时从所有预设移除）</label>
                <div id="np-tag-list" class="np-tag-manage-list"></div>
            </div>

            <div class="np-modal-actions">
                <button id="np-tag-close" class="btn-secondary">关闭</button>
            </div>
        </div>
    </div>
</body>

</html>
