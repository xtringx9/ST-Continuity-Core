<!-- src/features/nai-preset-switcher/index.html -->
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智绘姬NAI预设切换</title>
    <link rel="stylesheet" href="../../shared/styles/themes.css">
    <link rel="stylesheet" href="../../shared/styles/editor-shell.css">
    <link rel="stylesheet" href="styles/layout.css">
</head>

<body>
    <header class="app-header">
        <div class="header-title" data-i18n="ccore_nai_preset_title">智绘姬NAI预设切换</div>
        <div class="header-actions">
            <button id="close-btn"
                style="background:none; border:none; color:var(--text-primary); font-size:20px; cursor:pointer;">✕</button>
        </div>
    </header>

    <div class="app-container">
        <!-- 左侧主导航栏 -->
        <nav class="main-nav">
            <div class="nav-item active" data-target="view-preset">
                <span class="nav-text" data-i18n="ccore_nai_tab_preset">预设管理</span>
            </div>
            <div class="nav-item" data-target="view-vibe">
                <span class="nav-text" data-i18n="ccore_nai_tab_vibe">氛围管理</span>
            </div>
            <div class="nav-item" data-target="view-parse">
                <span class="nav-text" data-i18n="ccore_nai_tab_parse">解析</span>
            </div>
            <div class="nav-item" data-target="view-tools">
                <span class="nav-text" data-i18n="ccore_nai_tab_tools">工具箱</span>
            </div>
        </nav>

        <!-- 内容区域 -->
        <main class="content-area">
            <!-- 视图：预设 -->
            <div id="view-preset" class="view-section active">
                <div class="np-toolbar">
                    <input type="text" id="np-search" class="np-search" placeholder="搜索名称或标签…" />
                </div>

                <div class="np-tag-bar" id="np-tag-bar">
                    <!-- 标签筛选由 JS 生成 -->
                </div>

                <div class="np-list" id="np-list">
                    <!-- 预设卡片由 JS 生成 -->
                </div>
            </div>

            <!-- 视图：氛围（占位） -->
            <div id="view-vibe" class="view-section">
                <div class="np-placeholder">氛围功能开发中…</div>
            </div>

            <!-- 视图：解析（占位） -->
            <div id="view-parse" class="view-section">
                <div class="np-placeholder">解析功能开发中…</div>
            </div>

            <!-- 视图：工具箱 -->
            <div id="view-tools" class="view-section">
                <div class="detail-content">
                    <div class="toolbox-container">
                        <div class="form-section-title" data-i18n="ccore_nai_tools_title">数据工具</div>
                        <div class="toolbox-actions">
                            <button id="np-import-legacy" class="btn-secondary" data-i18n="ccore_nai_import_legacy">导入旧配置</button>
                            <button id="np-sync-images" class="btn-secondary" data-i18n="ccore_nai_sync_images">同步旧配置图片到智绘姬</button>
                            <button id="np-print-config" class="btn-secondary" data-i18n="ccore_nai_print_config">打印配置</button>
                        </div>
                        <div id="np-tools-result" class="np-tools-result"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 编辑弹层 -->
    <div class="np-modal-mask" id="np-modal-mask" style="display:none;">
        <div class="np-modal">
            <div class="np-modal-title" id="np-modal-title">新建预设</div>
            <div class="np-form-row">
                <label>名称</label>
                <input type="text" id="np-f-name" class="np-input" placeholder="预设名称" />
            </div>
            <div class="np-form-row">
                <label>标签（逗号分隔）</label>
                <input type="text" id="np-f-tags" class="np-input" placeholder="风格, 场景" />
            </div>
            <!-- 提示词（positive/negative）不在此编辑：实时读智绘姬 yushe[name] -->
            <div class="np-modal-actions">
                <button id="np-cancel" class="np-btn">取消</button>
                <button id="np-save" class="np-btn np-btn-primary">保存</button>
            </div>
        </div>
    </div>
</body>

</html>
