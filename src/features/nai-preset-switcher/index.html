<!-- src/features/nai-preset-switcher/index.html -->
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智绘姬NAI预设切换</title>
    <link rel="stylesheet" href="../../shared/styles/themes.css">
    <link rel="stylesheet" href="../../shared/styles/editor-shell.css">
    <link rel="stylesheet" href="styles/layout.css">
</head>

<body>
    <header class="app-header">
        <div class="header-title" data-i18n="ccore_nai_preset_title">智绘姬NAI预设切换</div>
        <div class="header-actions">
            <!-- 与 module-editor header 对齐：导入在左、导出在右，按钮样式一致 -->
            <button id="np-import-tags" class="btn-secondary" style="padding:6px 12px; font-size:13px;">导入标签</button>
            <button id="np-export-tags" class="btn-secondary" style="padding:6px 12px; font-size:13px;">导出标签</button>
            <button id="close-btn"
                style="background:none; border:none; color:var(--text-primary); font-size:20px; cursor:pointer;">✕</button>
        </div>
    </header>

    <div class="app-container">
        <!-- 左侧主导航栏 -->
        <nav class="main-nav">
            <div class="nav-item active" data-target="view-preset">
                <span class="nav-text" data-i18n="ccore_nai_tab_preset">预设管理</span>
            </div>
            <div class="nav-item" data-target="view-vibe">
                <span class="nav-text" data-i18n="ccore_nai_tab_vibe">氛围管理</span>
            </div>
            <div class="nav-item" data-target="view-parse">
                <span class="nav-text" data-i18n="ccore_nai_tab_parse">解析</span>
            </div>
            <div class="nav-item" data-target="view-tools">
                <span class="nav-text" data-i18n="ccore_nai_tab_tools">工具箱</span>
            </div>
        </nav>

        <!-- 内容区域 -->
        <main class="content-area">
            <!-- 视图：预设 -->
            <div id="view-preset" class="view-section active">
                <div class="np-toolbar">
                    <input type="text" id="np-search" class="np-search" placeholder="搜索名称或标签…" />
                    <button id="np-sort" class="btn-sort" title="排序方式"></button>
                    <button id="np-manage-tags" class="btn-secondary">管理标签</button>
                </div>

                <div class="np-tag-bar" id="np-tag-bar">
                    <!-- 标签筛选由 JS 生成 -->
                </div>

                <div class="np-list" id="np-list">
                    <!-- 预设卡片由 JS 生成 -->
                </div>

                <button id="np-scroll-top" class="np-scroll-top" title="回到顶部" style="display:none;">↑</button>
            </div>

            <!-- 视图：氛围（占位） -->
            <div id="view-vibe" class="view-section">
                <div class="np-placeholder">氛围功能开发中…</div>
            </div>

            <!-- 视图：解析（占位） -->
            <div id="view-parse" class="view-section">
                <div class="np-placeholder">解析功能开发中…</div>
            </div>

            <!-- 视图：工具箱 -->
            <div id="view-tools" class="view-section">
                <div class="detail-content">
                    <div class="toolbox-container">
                        <div class="form-section-title" data-i18n="ccore_nai_tools_title">数据工具</div>
                        <div class="toolbox-actions">
                            <button id="np-import-legacy" class="btn-secondary" data-i18n="ccore_nai_import_legacy">导入旧配置</button>
                            <button id="np-sync-images" class="btn-secondary" data-i18n="ccore_nai_sync_images">同步旧配置图片到智绘姬</button>
                            <button id="np-print-config" class="btn-secondary" data-i18n="ccore_nai_print_config">打印配置</button>
                        </div>
                        <div id="np-tools-result" class="np-tools-result"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 编辑弹层（通用 shell 弹层 .modal-mask / .modal） -->
    <div class="modal-mask" id="np-modal-mask" style="display:none;">
        <div class="modal">
            <div class="np-modal-title" id="np-modal-title">新建预设</div>
            <div class="np-form-row">
                <label>名称</label>
                <input type="text" id="np-f-name" class="np-input" placeholder="预设名称" />
            </div>
            <div class="np-form-row">
                <label>标签</label>
                <div id="np-f-tags" class="np-tag-editor"></div>
                <div class="np-tag-pool-wrap">
                    <div class="np-tag-pool-bar">
                        <input type="text" id="np-f-tag-search" class="np-input np-tag-search" placeholder="搜索标签…" />
                        <button id="np-f-tag-all" class="btn-secondary np-tag-pool-btn">全选</button>
                        <button id="np-f-tag-clear" class="btn-secondary np-tag-pool-btn">清空</button>
                        <span id="np-f-tag-count" class="np-tag-pool-count"></span>
                    </div>
                    <div id="np-f-tag-pool" class="np-tag-pool"></div>
                </div>
                <div class="np-tag-add">
                    <input type="text" id="np-f-tag-input" class="np-input" placeholder="新建标签名" />
                    <button id="np-f-tag-add" class="btn-secondary">新建并选中</button>
                </div>
            </div>
            <!-- 提示词（positive/negative）不在此编辑：实时读智绘姬 yushe[name] -->
            <div class="np-modal-actions">
                <button id="np-cancel" class="btn-secondary">取消</button>
                <button id="np-save" class="btn-primary">保存</button>
            </div>
        </div>
    </div>

    <!-- 标签管理弹层（通用 shell 弹层） -->
    <div class="modal-mask" id="np-tag-mask" style="display:none;">
        <div class="modal">
            <div class="np-modal-title">标签管理</div>

            <div class="np-form-row">
                <label>新建标签（独立创建，无需关联预设）</label>
                <div class="np-tag-new">
                    <input type="text" id="np-tag-new-name" class="np-input" placeholder="新标签名" />
                    <button id="np-tag-new-add" class="btn-primary">添加</button>
                </div>
            </div>

            <div class="np-form-row">
                <label>现有标签（点击改名，删除会同时从所有预设移除）</label>
                <div id="np-tag-list" class="np-tag-manage-list"></div>
            </div>

            <div class="np-modal-actions">
                <button id="np-tag-close" class="btn-secondary">关闭</button>
            </div>
        </div>
    </div>
</body>

</html>
