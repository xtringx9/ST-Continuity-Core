<!-- src/features/generation-records/generationRecordsPanel.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成记录</title>
    <link rel="stylesheet" href="../../shared/styles/themes.css">
    <link rel="stylesheet" href="../../shared/styles/editor-shell.css">
    <style>
        /* 简洁滚动条 / checkbox / number spinner 主题样式已由 editor-shell.css 统一提供（本文件 link 引入） */

        /* === 整体布局：flex column 撑满窗口 === */
        body {
            margin: 0;
            padding: 0;
            background: var(--bg-app, #fff);
            color: var(--text-primary, #111);
            font-size: 13px;
            font-family: var(--font-main, sans-serif);
            box-sizing: border-box;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* === 顶栏（常驻：标题/上下文 + 关闭按钮） === */
        .ccore-records-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 4px 12px;
            border-bottom: 1px solid var(--border-color, rgba(128, 128, 128, 0.2));
            background: var(--bg-panel, #f9fafb);
            flex-shrink: 0;
            min-height: 32px;
        }

        .ccore-records-title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex: 1;
        }

        .ccore-records-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary, #111827);
            white-space: nowrap;
        }

        .ccore-records-title-back {
            /* 复用 editor-shell 的 .btn-back-icon 基础样式（❮ 图标）；此处仅补顶栏场景细节 */
            display: flex;
            padding: 2px 6px 2px 0;
            font-size: 16px;
        }
        .ccore-records-title-back:hover {
            color: var(--accent-color, #2563eb);
        }

        .ccore-records-title-ctx {
            font-size: 12px;
            color: var(--text-secondary, #666);
            white-space: normal;      /* 允许换行显示全（需求10） */
            overflow-wrap: break-word;
            word-break: break-all;
            min-width: 0;
        }

        .ccore-records-title-badge {
            font-size: 11px;
            font-weight: bold;
            padding: 1px 8px;
            border-radius: 8px;
            flex-shrink: 0;
            color: #fff;
        }
        .ccore-records-title-badge-pending {
            background: #C9762E;
        }
        .ccore-records-title-badge-running {
            background: #3b82f6;
        }
        .ccore-records-title-badge-saved {
            background: #4CAF50;
        }
        .ccore-records-title-badge-discarded {
            background: #999;
        }
        .ccore-records-title-badge-error {
            background: #f44336;
        }

        #ccore-records-close {
            background: none;
            border: none;
            color: var(--text-primary, #111);
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
            padding: 2px 4px;
        }

        /* === 筛选栏（单行；控件自动挤压适配宽度，不用滚动条） === */
        .ccore-records-filters {
            display: flex;
            flex-wrap: nowrap;
            gap: 6px;
            padding: 8px 12px 0;
            flex-shrink: 0;
            overflow: hidden;
        }

        .ccore-records-filters select,
        .ccore-records-filters input {
            padding: 3px 6px;
            border: 1px solid var(--border-color, rgba(128,128,128,0.3));
            border-radius: 4px;
            background: var(--bg-input, #fff);
            color: var(--text-input, #111);
            font-size: 12px;
            box-sizing: border-box;
        }

        /* 按需分配：宽度按内容自适应（basis:auto），可弹性增长撑满一行；
           内容多的下拉自然更宽，窄选项（状态）受 max-width 限制 */
        .ccore-records-filters select {
            flex: 1 1 auto;
            min-width: 0;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ⚠️ number input 不能 overflow:hidden（会裁掉 WebKit spinner 上下箭头） */
        .ccore-records-filters .ccore-records-floor-input {
            flex: 0 0 80px;           /* 楼层输入固定窄宽（含 spinner 空间） */
            padding-right: 2px;
        }

        /* === 主内容区（列表/详情共用滚动区域，撑满剩余高度） === */
        .ccore-records-main {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 8px 12px;
        }

        /* === 列表视图 === */
        #ccore-records-list {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .ccore-records-empty {
            padding: 24px;
            text-align: center;
            color: var(--text-muted, #999);
            font-size: 13px;
        }

        .ccore-records-card {
            border: 1px solid var(--border-color, rgba(128,128,128,0.3));
            border-radius: 6px;
            padding: 8px 10px;
            cursor: pointer;
            background: var(--bg-card, #fafafa);
            transition: border-color 0.15s, background-color 0.15s;
            flex-shrink: 0;
        }

        .ccore-records-card:hover {
            border-color: var(--accent-color, #2563eb);
            background: var(--bg-hover, rgba(128,128,128,0.08));
        }

        .ccore-records-card.ccore-records-pending {
            border-color: #C9762E;
            border-left-width: 3px;
        }

        .ccore-records-card.ccore-records-running {
            border-color: #3b82f6;
            border-left-width: 3px;
            background: color-mix(in srgb, var(--bg-card, #fafafa) 85%, #3b82f6 8%);
        }

        .ccore-records-card-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .ccore-records-status {
            font-size: 11px;
            font-weight: bold;
            padding: 1px 8px;
            border-radius: 8px;
            flex: 0 0 auto;
        }

        .ccore-records-pending .ccore-records-status {
            background: #C9762E;
            color: #fff;
        }

        .ccore-records-running .ccore-records-status {
            background: #3b82f6;
            color: #fff;
        }

        .ccore-records-saved .ccore-records-status {
            background: #4CAF50;
            color: #fff;
        }

        .ccore-records-discarded .ccore-records-status {
            background: #999;
            color: #fff;
        }

        .ccore-records-error .ccore-records-status {
            background: #f44336;
            color: #fff;
        }

        .ccore-records-meta {
            flex: 1;
            font-size: 12px;
            color: var(--text-secondary, #666);
        }

        .ccore-records-time {
            font-size: 11px;
            color: var(--text-muted, #999);
            flex: 0 0 auto;
        }

        .ccore-records-card-body {
            display: flex;
            gap: 8px;
            font-size: 12px;
            align-items: center;
        }

        .ccore-records-gen {
            color: var(--accent-color, #2563eb);
        }

        .ccore-records-note {
            color: var(--text-muted, #999);
        }

        .ccore-records-actions {
            margin-left: auto;
            flex: 0 0 auto;
        }

        .ccore-records-act {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            background: #f44336;
            color: #fff;
        }

        .ccore-records-act:hover {
            opacity: 0.85;
        }

        /* === 详情视图 === */
        #ccore-records-detail {
            flex: 1;
            min-height: 0;
            display: none;
            flex-direction: column;
            gap: 6px;
            overflow: hidden;
        }

        .ccore-records-detail-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-muted, #999);
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .ccore-records-detail-body {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .ccore-records-section {
            border: 1px solid var(--border-color, rgba(128,128,128,0.3));
            border-radius: 6px;
            background: var(--bg-card, #fafafa);
            padding: 6px 10px;
            flex-shrink: 0;
        }

        .ccore-records-sec-title {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-secondary, #666);
            margin-bottom: 4px;
        }

        .ccore-records-sec-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            padding: 2px 0;
        }
        .ccore-records-sec-toggle:hover {
            color: var(--accent-color, #2563eb);
        }
        .ccore-records-sec-caret {
            font-size: 10px;
            color: var(--text-muted, #999);
            flex-shrink: 0;
        }

        .ccore-records-section pre {
            margin: 0;
            font-family: var(--font-mono, monospace);
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text-primary, #111);
            max-height: 300px;
            overflow-y: auto;
        }

        .ccore-records-error {
            border-color: #f44336;
        }

        .ccore-records-error .ccore-records-sec-title {
            color: #f44336;
        }

        /* === 底部操作栏（详情视图专用：切左右 / 保存方式 / 查看当前 / 保存 / 抛弃 / 中止） === */
        .ccore-records-opbar {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-top: 1px solid var(--border-color, rgba(128, 128, 128, 0.2));
            background: var(--bg-panel, #f9fafb);
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .ccore-records-opbar button {
            background: none;
            border: 1px solid var(--border-color, rgba(128, 128, 128, 0.3));
            border-radius: 4px;
            color: var(--text-primary, #111);
            cursor: pointer;
            font-size: 12px;
            padding: 3px 10px;
            flex-shrink: 0;
        }

        .ccore-records-opbar button:hover {
            border-color: var(--accent-color, #2563eb);
        }
        .ccore-records-opbar button:disabled {
            color: var(--text-muted, #999);
            border-color: var(--border-color, rgba(128,128,128,0.2));
            background: none;
            cursor: not-allowed;
            opacity: 0.5;
        }
        .ccore-records-opbar button:disabled:hover {
            border-color: var(--border-color, rgba(128,128,128,0.2));
        }

        .ccore-records-opbar select {
            padding: 3px 6px;
            border: 1px solid var(--border-color, rgba(128,128,128,0.3));
            border-radius: 4px;
            background: var(--bg-input, #fff);
            color: var(--text-input, #111);
            font-size: 12px;
            flex-shrink: 0;
        }

        .ccore-records-opbar .ccore-records-nav-count {
            font-size: 11px;
            color: var(--text-muted, #999);
            flex-shrink: 0;
        }
        .ccore-records-opbar .ccore-records-nav-sep {
            flex: 1;
        }

        .ccore-records-opbar .ccore-records-save {
            background: #4CAF50;
            border-color: #4CAF50;
            color: #fff;
            font-weight: 600;
        }

        .ccore-records-opbar .ccore-records-save:hover {
            opacity: 0.9;
            border-color: #4CAF50;
        }

        .ccore-records-opbar .ccore-records-discard {
            background: #f44336;
            border-color: #f44336;
            color: #fff;
            font-weight: 600;
        }

        .ccore-records-opbar .ccore-records-discard:hover {
            opacity: 0.9;
            border-color: #f44336;
        }

        .ccore-records-opbar .ccore-records-readonly {
            font-size: 12px;
            color: var(--text-muted, #999);
            padding: 3px 10px;
        }

        /* 查看当前内容区域（opbar 下方展开） */
        .ccore-records-current {
            display: none;
            flex-shrink: 0;
            max-height: 140px;
            overflow-y: auto;
            margin: 0 12px;
            padding: 6px 10px;
            border: 1px solid var(--border-color, rgba(128,128,128,0.3));
            border-radius: 6px;
            background: var(--bg-card, #fafafa);
        }

        .ccore-records-current .ccore-records-sec-title {
            font-size: 11px;
        }

        .ccore-records-current pre {
            margin: 0;
            font-family: var(--font-mono, monospace);
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text-primary, #111);
        }

        /* === 底栏（信息类：待处理 / 结果数 / 记录时间） === */
        .ccore-records-footer {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 4px 12px;
            border-top: 1px solid var(--border-color, rgba(128, 128, 128, 0.2));
            background: var(--bg-panel, #f9fafb);
            flex-shrink: 0;
            font-size: 12px;
            color: var(--text-secondary, #666);
            min-height: 26px;
        }

        .ccore-records-footer .ccore-records-footer-info {
            color: var(--text-muted, #999);
        }

        .ccore-records-footer .ccore-records-footer-time {
            margin-left: auto;
            color: var(--text-muted, #999);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <!-- 顶栏：列表=「生成记录」标题；详情=返回 + 角色/聊天/楼层（title-wrap 动态渲染） -->
    <div class="ccore-records-header">
        <div class="ccore-records-title-wrap" id="ccore-records-title-wrap"></div>
        <button id="ccore-records-close" title="关闭">✕</button>
    </div>

    <!-- 筛选栏（单行常驻） -->
    <div class="ccore-records-filters">
        <select id="ccore-records-filter-gen" title="内容"></select>
        <select id="ccore-records-filter-char" title="角色"></select>
        <select id="ccore-records-filter-chat" title="聊天"></select>
        <input type="number" id="ccore-records-filter-floor" class="ccore-records-floor-input" placeholder="楼层" min="0">
        <select id="ccore-records-filter-status" title="状态">
            <option value="all">全部状态</option>
            <option value="pending">待处理</option>
            <option value="saved">已保存</option>
            <option value="discarded">已抛弃</option>
            <option value="error">失败</option>
        </select>
    </div>

    <!-- 主内容区 -->
    <div class="ccore-records-main">
        <!-- 列表视图 -->
        <div id="ccore-records-list"></div>

        <!-- 详情视图 -->
        <div id="ccore-records-detail">
            <div class="ccore-records-detail-meta" id="ccore-records-detail-meta"></div>
            <div class="ccore-records-detail-body" id="ccore-records-detail-body"></div>
        </div>
    </div>

    <!-- 查看当前内容（opbar 下方展开，仅详情视图） -->
    <div class="ccore-records-current" id="ccore-records-current">
        <div class="ccore-records-sec-title">当前存储内容（对比用）</div>
        <pre id="ccore-records-current-pre"></pre>
    </div>

    <!-- 底部操作栏（详情视图专用） -->
    <div class="ccore-records-opbar" id="ccore-records-opbar"></div>

    <!-- 底栏（信息类） -->
    <div class="ccore-records-footer">
        <span id="ccore-records-count"></span>
        <span class="ccore-records-footer-info" id="ccore-records-footer-info"></span>
        <span class="ccore-records-footer-time" id="ccore-records-footer-time"></span>
    </div>
</body>
</html>
