<!-- src/features/generator-content-browser/generatorContentBrowser.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生成内容总览</title>
    <link rel="stylesheet" href="../../shared/styles/themes.css">
    <link rel="stylesheet" href="../../shared/styles/editor-shell.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: var(--bg-app, #fff);
            color: var(--text-primary, #111);
            font-size: 13px;
            font-family: var(--font-main, sans-serif);
            box-sizing: border-box;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* === 顶栏 === */
        .ccore-content-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            border-bottom: 1px solid var(--border-color, rgba(128, 128, 128, 0.2));
            background: var(--bg-panel, #f9fafb);
            flex-shrink: 0;
            min-height: 32px;
        }

        .ccore-content-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary, #111827);
            white-space: nowrap;
        }

        .ccore-content-subtitle {
            font-size: 12px;
            color: var(--text-secondary, #666);
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #ccore-content-close {
            background: none;
            border: none;
            color: var(--text-primary, #111);
            font-size: 14px;
            cursor: pointer;
            flex-shrink: 0;
            padding: 2px 4px;
        }

        /* === 列表 === */
        #ccore-content-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ccore-content-empty {
            padding: 24px;
            text-align: center;
            color: var(--text-muted, #999);
            font-size: 13px;
        }

        /* === 卡片（details 折叠） === */
        details.ccore-content-card {
            border: 1px solid var(--border-color, rgba(128, 128, 128, 0.3));
            border-radius: 6px;
            background: var(--bg-card, #fafafa);
            flex-shrink: 0;
        }

        details.ccore-content-card > summary {
            cursor: pointer;
            list-style: none;
            padding: 6px 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }
        details.ccore-content-card > summary::-webkit-details-marker { display: none; }
        details.ccore-content-card > summary:hover {
            background: var(--bg-hover, rgba(128, 128, 128, 0.08));
        }

        .ccore-content-floor {
            font-weight: 700;
            color: var(--accent-color, #2563eb);
            flex: 0 0 auto;
        }
        .ccore-content-gen {
            font-weight: 600;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .ccore-content-swipe {
            font-size: 11px;
            color: var(--text-muted, #999);
            flex: 0 0 auto;
        }
        .ccore-content-caret {
            font-size: 10px;
            color: var(--text-muted, #999);
            flex: 0 0 auto;
            transition: transform 0.15s;
        }
        details.ccore-content-card[open] .ccore-content-caret { transform: rotate(90deg); }
        .ccore-content-jump {
            margin-left: auto;
            flex: 0 0 auto;
            font-size: 11px;
            padding: 1px 8px;
            border: 1px solid var(--border-color, rgba(128, 128, 128, 0.3));
            border-radius: 4px;
            background: var(--bg-input, #fff);
            color: var(--text-secondary, #666);
            cursor: pointer;
        }
        .ccore-content-jump:hover {
            border-color: var(--accent-color, #2563eb);
            color: var(--accent-color, #2563eb);
        }

        /* === 正文（markdown 片段 / 整页 iframe） === */
        .ccore-content-body {
            padding: 0 10px 10px;
            font-size: 13px;
            line-height: 1.6;
            overflow-wrap: break-word;
        }
        /* 整页生成内容子 iframe（沙盒内运行，高度由 postMessage 回传） */
        .ccore-content-body iframe.ccore-gen-doc {
            display: block;
            width: 100%;
            min-height: 60px;
            border: 0;
            background: transparent;
        }

        /* === 加载更多 === */
        #ccore-content-more-wrap {
            flex-shrink: 0;
            padding: 6px 12px 10px;
            text-align: center;
        }
        #ccore-content-more {
            background: none;
            border: 1px solid var(--border-color, rgba(128, 128, 128, 0.3));
            border-radius: 4px;
            color: var(--text-primary, #111);
            cursor: pointer;
            font-size: 12px;
            padding: 3px 14px;
        }
        #ccore-content-more:hover {
            border-color: var(--accent-color, #2563eb);
        }
    </style>
</head>
<body>
    <div class="ccore-content-header">
        <span class="ccore-content-title">生成内容总览</span>
        <span class="ccore-content-subtitle" id="ccore-content-subtitle"></span>
        <button id="ccore-content-close" title="关闭">✕</button>
    </div>

    <div id="ccore-content-list"></div>

    <div id="ccore-content-more-wrap">
        <button id="ccore-content-more">加载更早楼层</button>
    </div>

    <script>
        // 整页生成内容子 iframe（沙盒）高度回传桥：
        // 沙盒无 allow-same-origin，文档内拿不到 frameElement，用 postMessage 回传高度，
        // 这里按 data-doc-id 匹配到对应 iframe 并设高。
        (function () {
            window.addEventListener('message', function (e) {
                var d = e.data;
                if (!d || d.__ccore !== 'ccDocHeight' || !d.id) return;
                var id = String(d.id || '');
                var h = Number(d.h);
                if (!/^[A-Za-z0-9_-]+$/.test(id) || !isFinite(h) || h <= 0) return;
                var f = document.querySelector('.ccore-gen-doc[data-doc-id="' + id + '"]');
                if (f && Math.abs(parseFloat(f.style.height || '0') - h) > 1) {
                    f.style.minHeight = '0px';
                    f.style.height = h + 'px';
                }
            });
        })();
    </script>
</body>
</html>
