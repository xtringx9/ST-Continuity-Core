<!-- src/features/module-editor/index.html -->
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuity Module Editor</title>

    <!-- 引入样式表 -->
    <link rel="stylesheet" href="../../shared/styles/themes.css">
    <link rel="stylesheet" href="../../shared/styles/editor-shell.css">
    <link rel="stylesheet" href="styles/layout.css">
</head>

<body>
    <header class="app-header">
        <div class="header-title">
            <span>Continuity Core</span>
            <small style="opacity: 0.6; font-weight: normal;">v1.0</small>
        </div>
        <div class="header-actions">
            <button id="header-import-btn" class="btn-secondary" style="padding: 6px 12px; font-size: 13px;"
                data-i18n="ccore_btn_import">导入</button>
            <button id="header-export-btn" class="btn-secondary" style="padding: 6px 12px; font-size: 13px;"
                data-i18n="ccore_btn_export">导出</button>
            <button id="header-save-btn" class="btn-primary" style="padding: 6px 12px; font-size: 13px;" data-i18n="ccore_btn_save">保存</button>
            <button id="close-btn"
                style="background:none; border:none; color:var(--text-primary); font-size:20px; cursor:pointer;">✕</button>
        </div>
    </header>

    <div class="app-container">
        <!-- 1. 主导航栏 (Sidebar) -->
        <nav class="main-nav">
            <div class="nav-item active" data-target="view-modules">
                <span class="nav-icon">📦</span>
                <span class="nav-text" data-i18n="ccore_nav_modules">模块定义</span>
            </div>
            <div class="nav-item" data-target="view-profiles">
                <span class="nav-icon">👥</span>
                <span class="nav-text" data-i18n="ccore_nav_profiles">角色绑定</span>
            </div>
            <div class="nav-item" data-target="view-settings">
                <span class="nav-icon">⚙️</span>
                <span class="nav-text" data-i18n="ccore_nav_settings">全局设置</span>
            </div>
            <div class="nav-item" data-target="view-async">
                <span class="nav-icon">⚡</span>
                <span class="nav-text" data-i18n="ccore_nav_async">异步配置</span>
            </div>
            <div class="nav-item" data-target="view-tools">
                <span class="nav-icon">🛠️</span>
                <span class="nav-text" data-i18n="ccore_nav_tools">工具箱</span>
            </div>
        </nav>

        <!-- 2. 内容区域 -->
        <main class="content-area">

            <!-- 视图 A: 模块定义 (Master-Detail) -->
            <div id="view-modules" class="view-section active">
                <!-- 左侧：模块列表 -->
                <aside class="module-list-panel">
                    <div class="list-toolbar">
                        <input type="text" data-i18n-placeholder="ccore_search_placeholder" placeholder="搜索模块..."
                            style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-input);">
                        <button style="padding: 6px 10px; cursor: pointer;">+</button>
                    </div>
                    <div class="list-content" id="module-list">
                        <!-- 列表项将由 JS 生成 -->
                        <div style="padding: 10px; text-align: center; color: var(--text-secondary);" data-i18n="ccore_loading">
                            加载中...
                        </div>
                    </div>
                </aside>
                <!-- 右侧：详情编辑 -->
                <section class="module-detail-panel">
                    <div class="detail-content">
                        <div style="text-align: center; margin-top: 50px; color: var(--text-muted);">
                            <p data-i18n="ccore_msg_select_module">请从左侧选择一个模块进行编辑</p>
                            <p data-i18n="ccore_msg_or_create">或者点击 + 号创建新模块</p>
                        </div>
                    </div>
                </section>
            </div>

            <!-- 视图 B: 角色绑定（左栏角色树 + 右栏编辑器） -->
            <div id="view-profiles" class="view-section">
                <aside class="binding-tree-panel">
                    <div class="list-toolbar">
                        <input type="text" data-i18n-placeholder="ccore_binding_search_placeholder" placeholder="搜索角色..."
                            style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-input);">
                    </div>
                    <div class="list-content" id="binding-tree-list">
                        <!-- 角色树由 JS 生成 -->
                    </div>
                </aside>
                <section class="binding-detail-panel">
                    <div class="detail-content" id="binding-detail-content">
                        <!-- 编辑器由 JS 生成 -->
                    </div>
                </section>
            </div>

            <!-- 视图 C: 工具箱 (占位) -->
            <div id="view-tools" class="view-section">
                <div class="detail-content">
                    <div class="toolbox-container">
                        <div class="form-section-title" id="title-debug-tools" data-i18n="ccore_title_debug_tools">调试工具</div>
                        <div class="debug-tools">
                            <div class="debug-tool-group">
                                <span class="debug-tool-group-label" data-i18n="ccore_label_debug_general">通用</span>
                                <button id="btn-debug-cache" class="btn-debug" data-i18n="ccore_btn_debug_cache">打印缓存数据</button>
                                <button id="btn-debug-config" class="btn-debug" data-i18n="ccore_btn_debug_config">打印配置数据</button>
                                <button id="btn-debug-context" class="btn-debug" data-i18n="ccore_btn_debug_context">打印上下文数据</button>
                                <button id="btn-debug-user-handle" class="btn-debug" data-i18n="ccore_btn_debug_user_handle">打印用户Handle</button>
                                <button id="btn-debug-state" class="btn-debug" data-i18n="ccore_btn_debug_state">打印编辑器状态</button>
                                <button id="btn-debug-clean-config" class="btn-debug" data-i18n="ccore_btn_debug_clean_config">清理废弃配置键</button>
                                <button id="btn-debug-panel" class="btn-debug" data-i18n="ccore_btn_debug_panel">调试面板（测试）</button>
                            </div>
                            <div class="debug-tool-group">
                                <span class="debug-tool-group-label" data-i18n="ccore_label_debug_server">服务器</span>
                                <button id="btn-debug-server-list" class="btn-debug" data-i18n="ccore_btn_debug_server_list">列出服务器目录</button>
                                <button id="btn-debug-server-save" class="btn-debug" data-i18n="ccore_btn_debug_server_save">服务器写入测试</button>
                                <button id="btn-debug-server-read" class="btn-debug" data-i18n="ccore_btn_debug_server_read">服务器读取测试</button>
                                <button id="btn-debug-server-delete" class="btn-debug" data-i18n="ccore_btn_debug_server_delete">服务器删除测试</button>
                            </div>
                            <div class="debug-tool-group">
                                <span class="debug-tool-group-label" data-i18n="ccore_label_debug_storage">存储层</span>
                                <button id="btn-debug-storage-init" class="btn-debug" data-i18n="ccore_btn_debug_storage_init">初始化存储</button>
                                <button id="btn-debug-storage-append" class="btn-debug" data-i18n="ccore_btn_debug_storage_append">追加测试数据</button>
                                <button id="btn-debug-storage-read" class="btn-debug" data-i18n="ccore_btn_debug_storage_read">读取楼层</button>
                                <button id="btn-debug-storage-update" class="btn-debug" data-i18n="ccore_btn_debug_storage_update">更新楼层</button>
                                <button id="btn-debug-storage-snapshot" class="btn-debug" data-i18n="ccore_btn_debug_storage_snapshot">写入快照</button>
                                <button id="btn-debug-storage-read-snapshot" class="btn-debug" data-i18n="ccore_btn_debug_storage_read_snapshot">读取快照</button>
                                <button id="btn-debug-storage-accumulated" class="btn-debug" data-i18n="ccore_btn_debug_storage_accumulated">累积状态</button>
                                <button id="btn-debug-storage-meta" class="btn-debug" data-i18n="ccore_btn_debug_storage_meta">读取Meta</button>
                                <button id="btn-debug-storage-list" class="btn-debug" data-i18n="ccore_btn_debug_storage_list">列出聊天</button>
                            </div>
                        </div>

                        <!-- 提示词预览容器 -->
                        <div id="tool-prompt-preview-container"></div>

                        <div class="form-section-title" data-i18n="ccore_label_source_settings">来源设置</div>
                        <div class="form-grid">
                            <div class="form-group">
                                <label data-i18n="ccore_label_floor_start">起始楼层</label>
                                <input type="number" id="tool-floor-start" value="1">
                            </div>
                            <div class="form-group">
                                <label data-i18n="ccore_label_floor_end">结束楼层</label>
                                <input type="number" id="tool-floor-end" data-i18n-placeholder="ccore_placeholder_latest" placeholder="最新">
                            </div>
                        </div>

                        <div class="form-section-title" data-i18n="ccore_label_select_modules">选择模块</div>
                        <div class="toolbox-actions" style="margin-bottom: 10px; display: flex; gap: 8px;">
                            <button id="btn-tool-select-all" class="btn-secondary"
                                data-i18n="ccore_btn_select_all">全选</button>
                            <button id="btn-tool-select-none" class="btn-secondary"
                                data-i18n="ccore_btn_select_none">清空</button>
                            <button id="btn-tool-select-enabled" class="btn-secondary"
                                data-i18n="ccore_btn_select_enabled">仅启用</button>
                        </div>
                        <div id="tool-module-list" class="form-group form-full-width toolbox-list">
                            <!-- 模块复选框将由 JS 生成 -->
                        </div>

                        <div style="margin-top: 20px; text-align: right;">
                            <button id="btn-extract" class="btn-primary" data-i18n="ccore_btn_extract">开始提取</button>
                        </div>

                        <div class="form-section-title results-title" data-i18n="ccore_label_results">提取结果</div>
                        <textarea id="tool-results" rows="10" class="results-textarea" readonly></textarea>
                    </div>
                </div>
            </div>

            <!-- 视图 D: 设置 (占位) -->
            <div id="view-settings" class="view-section">
                <!-- 全局设置内容将由 JS 生成 -->
            </div>

            <!-- 视图 E: 异步配置（2026-08-17 新增，承接原 settings-panel async tab 的配置 UI） -->
            <div id="view-async" class="view-section">
                <!-- 异步配置内容将由 AsyncSettings.js 生成 -->
            </div>
        </main>
    </div>

</body>

</html>
