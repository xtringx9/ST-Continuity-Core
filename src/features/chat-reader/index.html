<!-- src/features/chat-reader/index.html -->
<!-- 图文阅读器 + 聊天管理：独立 iframe 页，复用酒馆渲染产物。
     JS 由父窗口 EntryButton 通过 initChatReader(doc) 驱动。
     结构对齐 editor-shell：.app-container > .main-nav(竖排tab) + .content-area(2x .view-section)。
     阅读视图（消息分页）+ 管理视图（聊天键位体检，只读，懒分析）。
     管理 tab 的 JS 在父窗口（chatManager 模块），与 ChatReader.js 同构。 -->
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图文阅读器</title>
    <link rel="stylesheet" href="../../shared/styles/themes.css">
    <link rel="stylesheet" href="../../shared/styles/editor-shell.css">
    <link rel="stylesheet" href="styles/layout.css">
</head>

<body>
    <header class="app-header">
        <div class="header-title" title="点击切换主题">
            <span>图文阅读器</span>
            <small style="opacity: 0.6; font-weight: normal; margin-left: 6px; font-size: 12px;" id="reader-chat-name"></small>
        </div>
        <div class="header-actions" style="display:flex; align-items:center; gap:6px;">
            <!-- 阅读视图专属：返回首页 + 页码跳转 -->
            <button id="reader-back-home" class="btn-back-icon" title="返回选择角色" style="display:none;">❮</button>
            <span id="reader-page-info" style="font-size:12px; color:var(--text-muted); white-space:nowrap; display:none;"></span>
            <input type="number" id="reader-page-input" min="1" placeholder="页" style="width:56px; padding:4px 6px; font-size:12px; background:var(--bg-input); color:var(--text-input); border:1px solid var(--border-color); border-radius:4px; display:none;" />
            <button id="reader-page-go" class="btn-secondary" title="跳转到该页" style="display:none;">跳</button>
            <button id="close-btn" style="background:none; border:none; color:var(--text-primary); font-size:20px; cursor:pointer;">✕</button>
        </div>
    </header>

    <div class="app-container">
        <!-- 左侧竖排 tab（对标 editor-shell .main-nav） -->
        <nav class="main-nav" id="reader-nav">
            <div class="nav-item active" id="reader-nav-read" data-view="read" title="图文阅读">
                <span class="nav-text">阅读</span>
            </div>
            <div class="nav-item" id="reader-nav-manage" data-view="manage" title="聊天管理">
                <span class="nav-text">管理</span>
            </div>
        </nav>

        <div class="content-area">
            <!-- ===== 阅读视图 ===== -->
            <section class="view-section active" id="reader-view-read">
                <!-- 首页：选择角色（点击角色弹窗选聊天） -->
                <div class="reader-home" id="reader-home">
                    <div class="reader-home-step" id="reader-step-char">
                        <div class="reader-home-toolbar">
                            <div class="reader-home-title" id="reader-char-title">选择角色</div>
                            <input type="search" class="reader-char-search" id="reader-char-search" placeholder="搜索角色名…" />
                        </div>
                        <div class="reader-char-grid" id="reader-char-grid">
                            <!-- 角色卡片由 JS 生成 -->
                        </div>
                    </div>
                </div>

                <!-- 阅读视图：消息分页 + 底部翻页栏 -->
                <div class="reader-body" id="reader-body" style="display:none;">
                    <!-- 当前页消息：由 JS 渲染 -->
                </div>

                <footer class="reader-footer" id="reader-footer" style="display:none;">
                    <button id="reader-prev-page" class="btn-secondary" title="上一页 (←)">◀ 上一页</button>
                    <div class="reader-footer-center">
                        <span id="reader-page-current" class="reader-page-indicator"></span>
                    </div>
                    <button id="reader-next-page" class="btn-secondary" title="下一页 (→)">下一页 ▶</button>
                </footer>
            </section>

            <!-- ===== 管理视图（主从：左角色树 + 右详情[聊天下拉 + 体检/提取子tab]） ===== -->
            <section class="view-section" id="reader-view-manage">
                <div class="md-split">
                    <!-- 左：角色树（搜索 + 列表） -->
                    <aside class="md-aside">
                        <div class="md-toolbar">
                            <input type="search" class="reader-char-search" id="manage-char-search" placeholder="搜索角色名…" />
                        </div>
                        <div class="md-list" id="manage-char-list">
                            <!-- 角色卡片由 JS 复用 renderCharPicker 生成 -->
                        </div>
                    </aside>
                    <!-- 右：详情（聊天下拉 + 子tab） -->
                    <section class="md-main">
                        <div class="detail-tabs" id="manage-detail-tabs">
                            <div class="sticky-title-group">
                                <button class="btn-back-icon mobile-only" id="reader-manage-back" title="返回角色列表">❮</button>
                                <span class="sticky-module-name" id="reader-manage-char-label"></span>
                            </div>
                            <div class="detail-tab-item active" data-target="manage-tab-health">分析</div>
                            <div class="detail-tab-item" data-target="manage-tab-extract">提取</div>
                        </div>
                        <div class="manage-detail-head">
                            <select class="manage-chat-select" id="manage-chat-select" disabled>
                                <option value="">请先在左侧选择角色…</option>
                            </select>
                        </div>
                        <!-- 分析 -->
                        <div class="detail-tab-panel active" id="manage-tab-health">
                            <div class="reader-manage-head-row">
                                <div class="reader-manage-crumb" id="reader-manage-crumb">
                                    <span id="reader-manage-chat-label" class="reader-manage-chat-label"></span>
                                </div>
                                <div class="reader-manage-actions">
                                    <button class="btn-primary" id="reader-manage-analyze">开始分析</button>
                                    <button class="btn-secondary" id="reader-manage-cancel" style="display:none;">取消</button>
                                </div>
                            </div>
                            <div class="reader-manage-meta" id="reader-manage-meta"></div>
                            <div class="reader-manage-progress" id="reader-manage-progress" style="display:none;">
                                <div class="reader-manage-progress-bar"><div class="reader-manage-progress-fill" id="reader-manage-progress-fill"></div></div>
                                <div class="reader-manage-progress-text" id="reader-manage-progress-text"></div>
                            </div>
                            <div class="reader-manage-report" id="reader-manage-report">
                                <!-- 分析报告由 JS 渲染 -->
                            </div>
                        </div>
                        <!-- 提取 -->
                        <div class="detail-tab-panel" id="manage-tab-extract">
                            <div class="extract-controls">
                                <div class="form-group extract-tpl-bar">
                                    <label>模板</label>
                                    <select class="extract-tpl-select" id="extract-tpl-select">
                                        <option value="">— 未保存 —</option>
                                    </select>
                                    <button class="btn-secondary" id="extract-tpl-load">载入</button>
                                    <input type="text" id="extract-tpl-name" placeholder="模板名" />
                                    <button class="btn-secondary" id="extract-tpl-saveas">另存为</button>
                                    <button class="btn-secondary" id="extract-tpl-rename">重命名</button>
                                    <button class="btn-secondary" id="extract-tpl-delete">删除</button>
                                </div>
                                <div class="form-group">
                                    <label>正则</label>
                                    <input type="text" id="extract-pattern" placeholder="例 (?<name>[^：]+)：(.*)" />
                                </div>
                                <div class="form-group">
                                    <label>flags</label>
                                    <input type="text" id="extract-flags" value="g" style="max-width:90px;" />
                                </div>
                                <div class="form-group">
                                    <label>模板</label>
                                    <textarea id="extract-template" rows="3" placeholder="例 |模块名|字段:$1|  （$0整段 $1..$n组 ${name}命名 $$字面）"></textarea>
                                </div>
                                <div class="form-group extract-role-group">
                                    <label>消息来源</label>
                                    <span class="extract-role-opts">
                                        <label><input type="checkbox" id="extract-include-user" /> 用户消息</label>
                                        <label><input type="checkbox" id="extract-include-ai" checked /> AI消息</label>
                                    </span>
                                </div>
                                <div class="reader-manage-actions">
                                    <button class="btn-primary" id="extract-run">提取</button>
                                    <button class="btn-secondary" id="extract-copy" disabled>复制全部</button>
                                </div>
                            </div>
                            <div class="extract-warn" id="extract-warn" style="display:none;"></div>
                            <div class="reader-manage-report" id="extract-results"></div>
                        </div>
                    </section>
                </div>
            </section>
        </div>
    </div>

    <!-- 键操作确认弹窗（导出/清理前预览，确认后才执行） -->
    <div class="modal-mask" id="reader-key-modal" style="display:none;">
        <div class="modal reader-key-modal">
            <div class="reader-chat-modal-head">
                <div class="reader-chat-modal-title" id="reader-key-modal-title">确认操作</div>
                <button class="reader-chat-modal-close" id="reader-key-modal-close" title="关闭">✕</button>
            </div>
            <div class="reader-key-modal-body">
                <div class="reader-key-modal-summary" id="reader-key-modal-summary"></div>
                <div class="reader-key-modal-samples" id="reader-key-modal-samples"></div>
            </div>
            <div class="reader-key-modal-foot">
                <button class="btn-secondary" id="reader-key-modal-cancel">取消</button>
                <button class="btn-primary" id="reader-key-modal-confirm">确认</button>
            </div>
        </div>
    </div>

    <!-- 聊天选择弹窗（阅读/管理共用，点击角色弹出） -->
    <div class="modal-mask" id="reader-chat-modal" style="display:none;">
        <div class="modal reader-chat-modal">
            <div class="reader-chat-modal-head">
                <div class="reader-chat-modal-title" id="reader-chat-modal-title">选择聊天</div>
                <button class="reader-chat-modal-close" id="reader-chat-modal-close" title="关闭">✕</button>
            </div>
            <div class="reader-chat-modal-header">
                <img class="reader-chat-modal-avatar" alt="">
            </div>
            <div class="reader-chat-modal-body" id="reader-chat-modal-body">
                <!-- 聊天列表由 JS 生成 -->
            </div>
        </div>
    </div>

</body>

</html>
