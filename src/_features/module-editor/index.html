<!-- src/_features/module-editor/index.html -->
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuity Module Editor</title>

    <!-- 引入样式表 -->
    <link rel="stylesheet" href="styles/themes.css">
    <link rel="stylesheet" href="styles/layout.css">
</head>

<body>
    <header class="app-header">
        <div class="header-title">
            <span>Continuity Core</span>
            <small style="opacity: 0.6; font-weight: normal;">v1.0</small>
        </div>
        <div class="header-actions">
            <!-- 主题切换器 -->
            <select id="theme-select"
                style="background: var(--bg-input); color: var(--text-input); border: 1px solid var(--border-color); padding: 4px; border-radius: 4px; margin-right: 10px;">
                <option value="default">默认 (蓝灰)</option>
                <option value="light">亮色 (Light)</option>
                <option value="midnight">午夜 (Midnight)</option>
                <option value="forest">森林 (Forest)</option>
            </select>
            <button id="close-btn"
                style="background:none; border:none; color:var(--text-primary); font-size:20px; cursor:pointer;">✕</button>
        </div>
    </header>

    <main class="app-body">
        <!-- 左侧：模块列表 -->
        <aside class="module-list-panel">
            <div class="list-toolbar">
                <input type="text" placeholder="搜索模块..."
                    style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-input); color: var(--text-input);">
                <button style="padding: 6px 10px; cursor: pointer;">+</button>
            </div>
            <div class="list-content" id="module-list">
                <!-- 列表项将由 JS 生成 -->
                <div style="padding: 10px; text-align: center; color: var(--text-secondary);">
                    加载中...
                </div>
            </div>
        </aside>
        <!-- 右侧：详情编辑 -->
        <section class="module-detail-panel">
            <div class="detail-content">
                <div style="text-align: center; margin-top: 50px; color: var(--text-muted);">
                    <p>请从左侧选择一个模块进行编辑</p>
                    <p>或者点击 + 号创建新模块</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        // 简单的关闭逻辑，发送消息给父窗口
        document.getElementById('close-btn').addEventListener('click', () => {
            window.parent.postMessage({ type: 'CLOSE_CONTINUITY_MODAL' }, '*');
        });

        // 主题切换逻辑
        document.getElementById('theme-select').addEventListener('change', (e) => {
            const theme = e.target.value;
            document.documentElement.setAttribute('data-theme', theme);
        });
    </script>
</body>

</html>
